# Upstream definition for NestJS Dev Container
upstream api_backend {
    server financehub-api-dev:3000 max_fails=3 fail_timeout=5s;
}

# Upstream definition for Vite Dev Container
upstream web_frontend {
    server financehub-web-dev:5173;
}

server {
    listen 80;
    server_name web-financehub.asik.local;

    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        
        # Enable WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name api-financehub.asik.local;

    location / {
        proxy_pass http://api_backend;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retry behavior during API hot-reloads
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 5;
        proxy_next_upstream_timeout 10s;

        # Connection timeout settings
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}