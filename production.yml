services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: financehub-api
    restart: unless-stopped
    env_file:
      - .production.env
      - .production.local.env
    networks:
      - shared-network
    depends_on:
      - mysql
      - redis

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: financehub-web
    restart: unless-stopped
    env_file:
      - .production.env
      - .production.local.env
    networks:
      - shared-network

networks:
  shared-network:
    external: true